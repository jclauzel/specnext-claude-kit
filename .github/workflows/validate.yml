name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Run the repository checks
        run: python tools/validate.py
      - name: Run the same checks in PowerShell (keeps validate.ps1 in step with validate.py)
        shell: pwsh
        run: ./tools/validate.ps1
